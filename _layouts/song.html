---
layout: default
---

<div class="container">
  <div>
    <h1>{{ page.title }}</h1>

    <div>
      {% if page.original_song %}
        <div>
          <span>Origineel:</span>
          <span>{{ page.original_song }}</span>
        </div>
      {% endif %}

      {% if page.genre %}
        <div>
          <span>Genre:</span>
          <span>{{ page.genre }}</span>
        </div>
      {% endif %}

      {% if page.key %}
        <div>
          <span>Toonsoort:</span>
          <span>{{ page.key }}</span>
        </div>
      {% endif %}
    </div>

<pre>{{ content }}</pre>

    <div>
      <a href="/liedjes_in_beta.html">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Terug naar alle liedjes
      </a>
    </div>
  </div>
</div>
